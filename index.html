<!doctype html>
<html lang="en" data-theme="auto">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--card:#fff;--ink:#0F172A;--mut:#64748B;--pri:#2563EB;--priInk:#fff;--acc:#38BDF8;--accInk:#0F172A;--note:#FEF3C7;--noteInk:#92400E;--line:#E2E8F0;--side:#0F172A;--sideInk:#fff;--grid:rgba(226,232,240,.55);--sec:#F1F5F9;--secInk:#334155;--panel:#EFF6FF;
--ok:#166534;--okBg:#DCFCE7;--warn:#92400E;--warnBg:#FEF3C7;--bad:#B91C1C;--badBg:#FEE2E2;--inp:#fff}
@media(prefers-color-scheme:dark){html[data-theme=auto]{--bg:#0B1120;--card:#111C30;--ink:#E2E8F0;--mut:#94A3B8;--pri:#3B82F6;--side:#020617;--line:#1E293B;--note:#3b2a07;--noteInk:#FCD34D;--grid:rgba(148,163,184,.06);--sec:#1E293B;--secInk:#CBD5E1;--panel:#0F2744;--ok:#86EFAC;--okBg:#052e16;--warn:#FCD34D;--warnBg:#3b2a07;--bad:#FCA5A5;--badBg:#450a0a;--inp:#0F172A}}
html[data-theme=dark]{--bg:#0B1120;--card:#111C30;--ink:#E2E8F0;--mut:#94A3B8;--pri:#3B82F6;--side:#020617;--line:#1E293B;--note:#3b2a07;--noteInk:#FCD34D;--grid:rgba(148,163,184,.06);--sec:#1E293B;--secInk:#CBD5E1;--panel:#0F2744;--ok:#86EFAC;--okBg:#052e16;--warn:#FCD34D;--warnBg:#3b2a07;--bad:#FCA5A5;--badBg:#450a0a;--inp:#0F172A}
*{box-sizing:border-box}
body{margin:0;font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14.5px;font-weight:500;color:var(--ink);background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 30px}
h1{font-size:28px;font-weight:800;margin:0 0 4px}h2{font-size:17px;font-weight:800;margin:0 0 10px}
.muted{color:var(--mut)}.small{font-size:12.5px}.right{margin-left:auto}.nowrap{white-space:nowrap}
#app{display:flex;min-height:100vh}
#side{width:228px;background:var(--side);color:var(--sideInk);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;flex-shrink:0}

.logo i{width:34px;height:34px;border-radius:9px;background:var(--acc);display:block;background-image:linear-gradient(#0F172A 2px,transparent 2px),linear-gradient(90deg,#0F172A 2px,transparent 2px);background-size:9px 9px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:inherit;background:none;border:0;font:inherit;font-weight:700;cursor:pointer;text-align:left;width:100%;border-left:4px solid transparent}
.nav:hover{background:rgba(255,255,255,.07)}.nav.on{background:#1E293B;border-left-color:#38BDF8}
.nav .bd{margin-left:auto;background:var(--acc);color:var(--accInk);border-radius:20px;padding:1px 8px;font-size:12px;font-weight:800}
#side .foot{margin-top:auto;font-size:12px;opacity:.8}
#main{flex:1;min-width:0;padding:22px 26px 60px;max-width:1180px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;border-top:4px solid var(--pri)}
.kpi.w{border-top-color:#F59E0B}.kpi b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.btn{background:var(--pri);color:var(--priInk);border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.1)}.btn.o{background:var(--acc);color:var(--accInk)}.btn.g{background:var(--sec);color:var(--secInk);border:1px solid var(--line)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--inp);border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:var(--acc)}
textarea{width:100%;min-height:140px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
input.w1{width:96px}input.w2{width:150px}input.wf{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:700;background:var(--okBg);color:var(--ok)}
.chip.warn{background:var(--warnBg);color:var(--warn)}.chip.bad{background:var(--badBg);color:var(--bad)}.chip.n{background:var(--line);color:var(--mut)}

.tw{overflow:auto;max-height:68vh}
.ord .ohead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}

.ev{font-size:12.5px;color:var(--mut);width:100%;padding-left:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tab{border:1.5px solid var(--line);color:var(--secInk);background:var(--sec);border-radius:20px;padding:5px 14px;font:inherit;font-weight:700;cursor:pointer}
.tab.on{background:var(--pri);color:var(--priInk)}
#toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50}
.t{background:var(--ink);color:var(--card);padding:10px 14px;border-radius:10px;max-width:340px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.t.bad{background:var(--bad);color:#fff}.t.warn{background:#FEF3C7;color:#92400E}
pre.rep{background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:300px;overflow:auto;font-size:12px;white-space:pre-wrap}
.login{max-width:380px;margin:12vh auto;text-align:center}.login .card{padding:26px}
@media(max-width:820px){#app{flex-direction:column}#side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:8px}.logo{margin:0 8px 0 0}.nav{width:auto;padding:7px 10px}#side .foot{display:none}#main{padding:14px 12px 50px}h1{font-size:23px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<datalist id="itemlist"></datalist>
<datalist id="catlist"></datalist>
<datalist id="partylist"></datalist>
<script>
// ===== PASTE YOUR APPS SCRIPT WEB APP URL ON THE NEXT LINE (Deploy -> Manage deployments -> Web app URL) =====
const API_URL = "https://script.google.com/macros/s/AKfycbxGi8zR-S9UwkWduIYtGpHthmT1a8AUROB_IqCXIVK76HfkNJdIUPsourevS6FMNuXo9g/exec";
// ===== end =====
const VERSION = "1.0.3";
const GODOWNS = ["Office", "5th Godown"];
const UNITS = ["", "pcs", "kg", "roll", "bundle", "bag"];

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const p2 = n => String(n).padStart(2, '0');
const fmt = n => (n == null || n === '' || isNaN(n)) ? '' : String(Number(Number(n).toFixed(3)));
const today = () => { const d = new Date(); return p2(d.getDate()) + '-' + p2(d.getMonth() + 1) + '-' + d.getFullYear(); };
const nowStamp = () => { const d = new Date(); return today() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); };
function parseDMY(s) {
  const m = String(s || '').trim().match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/); if (!m) return null;
  let y = +m[3]; if (y < 100) y += 2000; const d = +m[1], mo = +m[2];
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return p2(d) + '-' + p2(mo) + '-' + y;
}
const dkey = s => { const m = String(s || '').match(/^(\d{2})-(\d{2})-(\d{4})/); return m ? +(m[3] + m[2] + m[1]) : 0; };
function tsFrom(date, time) {
  const d = parseDMY(date); if (!d) return 0;
  const tm = String(time || '').match(/(\d{1,2})[:.](\d{2})(?::\d{2})?\s*([ap]m)?/i);
  let h = tm ? +tm[1] : 12, mi = tm ? +tm[2] : 0;
  if (tm && tm[3]) { const pm = /pm/i.test(tm[3]); if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
  const [dd, mm, yy] = d.split('-').map(Number);
  return new Date(yy, mm - 1, dd, h, mi).getTime();
}
function maskDate(el) {
  let v = el.value.replace(/\D/g, '').slice(0, 8), o = v.slice(0, 2);
  if (v.length > 2) o += '-' + v.slice(2, 4); if (v.length > 4) o += '-' + v.slice(4);
  el.value = o;
}
const rid = n => Math.random().toString(36).slice(2, 2 + n);
const newOp = () => 'x' + Date.now().toString(36) + rid(2);
const nk = s => String(s || '').toLowerCase().replace(/[×✕*]/g, 'x').replace(/\s+/g, '').replace(/[^a-z0-9./x+\-]/g, '');
function toks(s) {
  s = String(s).toLowerCase().replace(/[×✕*]/g, 'x'); const out = [];
  s.split(/[^a-z0-9./]+/).filter(Boolean).forEach(t => { if (/\d/.test(t) && /x/.test(t)) t.split('x').filter(Boolean).forEach(p => out.push(p)); else out.push(t); });
  return out;
}
function normUnit(u) {
  u = String(u || '').toLowerCase();
  if (/^kg/.test(u)) return 'kg'; if (/^(pic|pcs?|pc$|nos?$|pls|piece|sheet)/.test(u)) return 'pcs';
  if (/^roll/.test(u)) return 'roll'; if (/^(bundle|bdl)/.test(u)) return 'bundle'; if (/^bag/.test(u)) return 'bag'; return '';
}
function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h); }
function toast(msg, kind) {
  const t = document.createElement('div'); t.className = 't ' + (kind || ''); t.textContent = msg; $('#toast').appendChild(t);
  setTimeout(() => t.remove(), kind === 'bad' ? 7000 : 3800);
}

/* ---------------- state ---------------- */
const S = {
  items: [], byKey: {}, rows: [], stock: {}, moves: {}, orders: [], aliases: [], aliasMap: {}, cuts: [], prod: [], cats: [],
  types: { in: [], out: [] }, view: 'dash', by: ls.get('o5_by', ''), key: ls.get('o5_key', ''), theme: ls.get('o5_theme', 'auto'),
  outbox: ls.get('o5_outbox', []), syncedAt: 0, loaded: false, busy: false, err: '', draft: {}, prev: {}, ui: {},
  ordTab: 'wait', ordQ: '', stockQ: '', stockGo: '', stockSt: '', syncLog: [], cfg: ls.get('o5_cfg', { waitHrs: 3, lateHrs: 8 })
};

/* ---------------- api + outbox ---------------- */
async function api(action, body) {
  const t0 = performance.now(); let ok = false, err = '';
  try {
    if (!API_URL || API_URL.indexOf('PASTE_') === 0) throw new Error('API_URL not set in index.html');
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, key: S.key }, body || {})) });
    const j = await r.json();
    if (!j.ok) { err = j.error || 'error'; throw new Error(err); }
    ok = true; return j;
  } catch (e) { err = err || String(e.message || e); if (err === 'auth') { S.key = ''; ls.set('o5_key', ''); } throw new Error(err); }
  finally { S.syncLog.unshift({ t: nowStamp(), a: action, ms: Math.round(performance.now() - t0), ok, err }); S.syncLog.length = Math.min(S.syncLog.length, 60); }
}
function saveOutbox() { ls.set('o5_outbox', S.outbox); }
function queue(op) { S.outbox.push(op); saveOutbox(); updateSyncPill(); flush(); }
let flushing = false, retryT = null;
async function flush() {
  if (flushing) return; flushing = true;
  try {
    while (S.outbox.length) {
      const op = S.outbox[0];
      await api(op.action, op.body);
      S.outbox.shift(); saveOutbox(); S.err = ''; S.syncedAt = Date.now(); updateSyncPill();
    }
  } catch (e) {
    S.err = e.message; updateSyncPill();
    if (e.message === 'auth') render(); else { clearTimeout(retryT); retryT = setTimeout(flush, 15000); }
  } finally { flushing = false; }
}
function updateSyncPill() {
  const el = $('#pill'); if (!el) return;
  const n = S.outbox.length;
  el.className = 'chip ' + (n ? 'warn' : (S.err ? 'bad' : ''));
  el.textContent = n ? '⏳ ' + n + ' waiting to sync' : (S.err ? '⚠ ' + S.err.slice(0, 40) : (S.syncedAt ? '✓ Synced ' + new Date(S.syncedAt).toTimeString().slice(0, 5) : '…'));
}

/* ---------------- data ---------------- */
function applyData(j) {
  S.items = j.items || []; S.rows = (j.rows || []).map(r => ({ s: r[0], d: r[1], ty: r[2], p: r[3], q: r[4], g: r[5], n: r[6], t: r[7] }));
  S.orders = j.orders || []; S.aliases = j.aliases || []; S.cuts = j.cuts || []; S.prod = j.prod || [];
  rebuild();
}
function rebuild() {
  S.byKey = {}; S.items.forEach(i => { S.byKey[nk(i.name)] = i; });
  S.aliasMap = {}; S.aliases.forEach(a => { S.aliasMap[nk(a.a)] = a.i; });
  S.cats = [...new Set(S.items.map(i => i.cat).filter(Boolean))];
  const tin = new Set(), tout = new Set(); S.rows.forEach(r => (r.s === 'IN' ? tin : tout).add(r.ty));
  ['Transfer In', 'Purchase', 'Return', 'Production', 'Stock Correction'].forEach(t => tin.add(t));
  ['Sale', 'Transfer Out', 'Usage', 'Stock Correction'].forEach(t => tout.add(t));
  S.types = { in: [...tin].filter(Boolean), out: [...tout].filter(Boolean) };
  recalc();
  $('#itemlist').innerHTML = S.items.map(i => '<option value="' + esc(i.name) + '">').join('');
  $('#catlist').innerHTML = S.cats.map(c => '<option value="' + esc(c) + '">').join('');
  const parties = new Set(); S.orders.forEach(o => o.party && parties.add(o.party)); S.cuts.forEach(c => c[1] && parties.add(c[1]));
  $('#partylist').innerHTML = [...parties].map(p => '<option value="' + esc(p) + '">').join('');
}
function recalc() {
  S.stock = {}; S.moves = {};
  const ord = S.rows.map((r, i) => [r, i]).sort((a, b) => dkey(a[0].d) - dkey(b[0].d) || a[1] - b[1]);
  ord.forEach(([r]) => {
    const k = nk(r.p); const delta = r.s === 'IN' ? r.q : -r.q;
    S.stock[k] = (S.stock[k] || 0) + delta; (S.moves[k] = S.moves[k] || []).push({ r, bal: S.stock[k] });
  });
}
const stockOf = it => S.stock[nk(it.name)] || 0;
function statusOf(it) {
  const q = stockOf(it);
  if (q < 0) return { k: 'neg', t: '⛔ Negative', c: 'bad' };
  if (q === 0) return { k: 'none', t: '⛔ No stock', c: 'bad' };
  if (it.low != null && q <= it.low) return { k: 'low', t: '▲ Low stock', c: 'warn' };
  if (it.high != null && q > it.high) return { k: 'over', t: '◆ Overstock', c: '' };
  if (it.low == null && it.high == null) return { k: 'nolv', t: '○ Level not set', c: 'n' };
  return { k: 'ok', t: '✓ In stock', c: '' };
}
async function loadAll(quiet) {
  if (S.busy) return; S.busy = true; if (!quiet) render();
  try {
    await flush(); if (S.outbox.length) { S.busy = false; return; }
    const j = await api('load'); applyData(j); S.loaded = true; S.syncedAt = Date.now(); S.err = '';
    ls.set('o5_cache', { items: j.items, rows: j.rows, orders: j.orders, aliases: j.aliases, cuts: j.cuts, prod: j.prod });
  } catch (e) { S.err = e.message; if (!S.loaded) toast('Could not load: ' + e.message, 'bad'); }
  S.busy = false; render();
}

/* ---------------- parsing ---------------- */
const UNIT_RE = 'kgs?|pics?|pcs?|nos|no|rolls?|bundles?|bdl|bags?|pls|pieces?|sheets?';
const ITEM_RE = new RegExp('^(.*?\\S)\\s*[-–—=:]\\s*(\\d+(?:\\.\\d+)?)\\s*(' + UNIT_RE + ')?\\b\\s*(\\(.*?\\))?\\s*$', 'i');
const ITEM_RE2 = new RegExp('^(.*?[A-Za-z].*?)\\s+(\\d+(?:\\.\\d+)?)\\s*(' + UNIT_RE + ')\\b\\s*(\\(.*?\\))?\\s*$', 'i');
const VEH_RE = /\bK[LA][\s-]?\d{1,2}[\s-]?[A-Z]{1,3}[\s-]?\d{3,4}\b/i;
const cleanTxt = t => String(t || '').replace(/[×✕]/g, 'x').replace(/[‎‏ ]/g, ' ').replace(/\r/g, '');
function waMatch(ln) {
  let m = ln.match(/^\[(\d{1,2}[:.]\d{2}(?::\d{2})?\s?(?:[ap]m)?),?\s*(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4})\]\s*([^:]{1,60}):\s?(.*)$/i);
  if (m) return { time: m[1], date: m[2], sender: m[3].trim(), text: m[4] };
  m = ln.match(/^(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}),?\s*(\d{1,2}[:.]\d{2}(?::\d{2})?\s?(?:[ap]m)?)\s*-\s*([^:]{1,60}):\s?(.*)$/i);
  if (m) return { date: m[1], time: m[2], sender: m[3].trim(), text: m[4] };
  return null;
}
function splitMessages(text) {
  const lines = cleanTxt(text).split('\n'); const blocks = []; let cur = null, wa = false;
  for (const ln of lines) {
    const m = waMatch(ln);
    if (m) { wa = true; cur = { sender: m.sender, ts: tsFrom(m.date, m.time), lines: [] }; blocks.push(cur); if (m.text.trim()) cur.lines.push(m.text); }
    else { if (!cur) { cur = { sender: '', ts: 0, lines: [] }; blocks.push(cur); } cur.lines.push(ln); }
  }
  if (wa) return blocks;
  const out = []; let c = [];
  for (const ln of lines) { if (!ln.trim()) { if (c.length) { out.push({ sender: '', ts: 0, lines: c }); c = []; } } else c.push(ln); }
  if (c.length) out.push({ sender: '', ts: 0, lines: c });
  return out;
}
function itemLine(l) {
  let m = l.match(ITEM_RE) || l.match(ITEM_RE2); if (!m) return null;
  return { raw: m[1].trim(), q: parseFloat(m[2]), u: normUnit(m[3]), max: /max/i.test(m[4] || '') };
}
function parseOrderBlock(b) {
  const o = { party: '', note: [], vehicle: '', lines: [] }; let prefix = '';
  const raw = b.lines.join('\n');
  for (let l of b.lines) {
    l = l.replace(/@~?\S+(\s\S+)?/g, m => m).trim(); if (!l) continue;
    const vm = l.match(VEH_RE); if (vm && !o.vehicle) o.vehicle = vm[0].toUpperCase().replace(/\s+/g, '');
    if (/^(load|loaded|make ready|ready|vehicle|pls load|please load)\b/i.test(l)) { const nt = l.replace(/@~?[^@]*$/, '').trim(); if (nt && !/^load$/i.test(nt)) o.note.push(nt); continue; }
    const it = itemLine(l);
    if (it) { it.prefix = prefix; o.lines.push(it); continue; }
    if (!o.party && !o.lines.length) o.party = l; else prefix = l;
  }
  o.note = o.note.join('; '); o.raw = raw; o.ts = b.ts;
  return o;
}
function suggest(txt) {
  const a = new Set(toks(txt)); if (!a.size) return [];
  const sc = [];
  S.items.forEach(it => { const b = new Set(toks(it.name)); let inter = 0; a.forEach(t => { if (b.has(t)) inter++; }); const s = inter / (a.size + b.size - inter); if (s >= 0.3) sc.push([s, it.name]); });
  return sc.sort((x, y) => y[0] - x[0]).slice(0, 4).map(x => x[1]);
}
function matchName(raw, prefix) {
  const tries = []; if (prefix) tries.push([prefix + ' ' + raw, false]); tries.push([raw, !!prefix]);
  for (const [t, bare] of tries) {
    const k = nk(t); const al = S.aliasMap[k];

function parseOrders(text) {

    if (/^(total|chainlink production|nos\b|no production|item\b)/i.test(l)) continue;

    if (l.indexOf('\t') >= 0) { const c = l.split('\t').map(x => x.trim()).filter(x => x !== ''); name = c[0]; nums = c.slice(1).map(Number); }
    else { const m = l.match(/^(.*?\S)\s+(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)(?:\s+(\d+(?:\.\d+)?))?\s*$/); if (m) { name = m[1]; nums = m.slice(2).filter(x => x != null).map(Number); } }
    if (!name || nums.length < 3 || nums.some(isNaN)) { o.lines.push({ raw: l, bad: true }); continue; }
    const [nos, per, total] = nums; const dim = name.match(/x(\d+(?:\.\d+)?)x(\d+(?:\.\d+)?)ft/i);

  const body = Object.assign({ opId, by: S.by, rows }, extra || {});

    h += '<div class="panel"><div class="row">' + (su !== 'kg' ? '<label>Qty (' + esc(su) + ') <input class="w1" id="pq" inputmode="decimal" value="' + esc(pn.qty != null ? pn.qty : (pn.m === 'qty' ? l.q : '')) + '"></label>' : '') +
      '<label>Weight kg' + (su === 'kg' ? ' (stock is in kg)' : ' (optional)') + ' <input class="w1" id="pk" inputmode="decimal" value="' + esc(pn.kg != null ? pn.kg : '') + '"></label>' +

/* ---------------- events ---------------- */
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
const num = s => { const n = parseFloat(String(s).replace(',', '.')); return isFinite(n) ? n : null; };
const A = {
  nav(d) { S.view = d.v; S.ui = {}; render(); },
  reload() { loadAll(); },
  async login() {

    try { await api('ping'); ls.set('o5_key', pw); ls.set('o5_by', S.by); S.view = 'dash'; render(); loadAll(); } catch (e) { S.key = ''; const el = $('#lerr'); if (el) el.textContent = e.message === 'auth' ? 'Wrong password' : e.message; }
  },
  goOrder(d) { S.view = 'orders'; S.ordTab = 'wait'; S.ordQ = d.id; render(); },

  clearOrders() { S.draft.ordText = ''; S.prev.orders = null; render(); },
  saveOrders: saveOrdersPreview,
  ordTab(d) { S.ordTab = d.t; render(); },
  lsug(d) { const l = S.prev.orders[+d.o].lines[+d.l]; setLineItem(l, l.sugg[+d.s]); render(); },
  lrem(d) { S.prev.orders[+d.o].lines[+d.l].removed = true; render(); },
  lnew(d) { const l = S.prev.orders[+d.o].lines[+d.l]; S.ui.newItem = { o: +d.o, l: +d.l, name: l.raw }; render(); },
  niCancel() { S.ui.newItem = null; render(); },
  niSave() {
    const f = S.ui.newItem, name = val('ni_name').trim(); if (!name) { toast('Enter the item name', 'bad'); return; }
    if (S.byKey[nk(name)]) { toast('That item already exists — pick it from the list', 'bad'); return; }
    const l = S.prev.orders[f.o].lines[f.l]; l.newItem = { name, cat: val('ni_cat').trim(), loc: val('ni_loc'), unit: val('ni_unit') }; l.item = null; l.learn = true; S.ui.newItem = null; render();
  },
  lFull(d) {
    const o = S.orders.find(x => x.id === d.id), ln = o.items[+d.i], it = S.byKey[nk(ln.n)]; if (!it) return;
    const ou = normUnit(ln.u), su = it.unit || ou || 'pcs';
    if (su === ou || (!it.unit)) { if (su === 'kg') confirmLine(d.id, +d.i, { kg: ln.q, close: true }); else confirmLine(d.id, +d.i, { qty: ln.q, close: true }); }
    else { S.ui.panel = { id: d.id, i: +d.i, m: 'qty' }; toast('Ordered in ' + (ou || 'units') + ' but stock is in ' + su + ' — enter the amount', 'warn'); render(); }
  },
  lPanel(d) { S.ui.panel = { id: d.id, i: +d.i, m: d.m }; render(); },
  pNo() { S.ui.panel = null; render(); },
  pOk(d) { const p = S.ui.panel; confirmLine(p.id, p.i, { qty: num(val('pq')), kg: num(val('pk')), close: d.close === '1' }); },
  lDrop(d) { setLineState(d.id, +d.i, 'dropped'); },
  reopen(d) { setLineState(d.id, +d.i, 'open'); },
  cancelAsk(d) { S.ui.confirm = 'c:' + d.id; render(); },
  confirmNo() { S.ui.confirm = null; render(); },
  cancelYes(d) { const o = S.orders.find(x => x.id === d.id); o.items.forEach(l => { if (l.state === 'open') l.state = 'dropped'; }); o.status = orderStatus(o); S.ui.confirm = null; queue({ action: 'commit', body: { opId: newOp(), by: S.by, summary: 'order cancelled', order: o, rows: [] } }); render(); },
  undoAsk(d) { S.ui.confirm = 'u:' + d.tid; render(); },
  undoYes(d) { S.ui.confirm = null; undoOp(opTids(d.tid)); },
  readInc() { S.draft.incText = val_('incText'); S.prev.inc = parseIncoming(S.draft.incText); render(); },
  clearInc() { S.draft.incText = ''; S.prev.inc = null; render(); },
  incsug(d) { const l = S.prev.inc.lines[+d.l]; setLineItem(l, l.sugg[+d.s], true); render(); },
  increm(d) { S.prev.inc.lines.splice(+d.l, 1); render(); },
  saveInc() {
    const p = S.prev.inc, date = parseDMY(val('inc_date')); if (!date) { toast('Date should be dd-mm-yyyy', 'bad'); return; }
    if (!p.lines.length) { toast('No lines'); return; } if (p.lines.some(l => !l.item)) { toast('Match or remove the red lines first', 'bad'); return; }
    const type = val('inc_type'), veh = val('inc_veh').trim(), aliases = [];
    const rows = p.lines.map(l => { const it = S.byKey[nk(l.item)]; if (l.learn) aliases.push({ a: (l.prefix ? l.prefix + ' ' : '') + l.raw, i: it.name }); return { k: 'IN', date, type, item: it.name, qty: l.q, godown: it.loc, notes: ('Incoming ' + veh).trim() }; });
    commit(rows, { summary: 'incoming', aliases }); negWarn(rows.map(r => r.item)); S.prev.inc = null; S.draft.incText = ''; toast(rows.length + ' incoming lines saved'); render();
  },
  readProd() { S.draft.prodText = val_('prodText'); S.prev.prod = parseProduction(S.draft.prodText); render(); },
  clearProd() { S.draft.prodText = ''; S.prev.prod = null; render(); },
  psug(d) { const l = S.prev.prod.lines[+d.l]; setProdItem(l, l.sugg[+d.s]); render(); },
  prem(d) { S.prev.prod.lines.splice(+d.l, 1); render(); },
  saveProd() {
    const p = S.prev.prod, date = parseDMY(val('pr_date')); if (!date) { toast('Date should be dd-mm-yyyy', 'bad'); return; }
    const good = p.lines.filter(l => !l.bad); if (!good.length) { toast('No production lines'); return; }

    const rows = [], ups = [], aliases = []; let n = 0;
    good.forEach(l => {
      const it = S.byKey[nk(l.item)], none = /^none$/i.test(l.wire), w = none ? null : S.byKey[nk(l.wire)];
      if (l.learn) aliases.push({ a: l.raw, i: it.name });
      rows.push({ k: 'IN', tidSuffix: 'i' + n, date, type: 'Production', item: it.name, qty: l.nos, godown: it.loc, notes: 'Production' });
      rows.push({ k: 'PROD', tidSuffix: 'p' + n, date, item: it.name, nos: l.nos, per: l.per, total: l.total, sqft: l.sq, wire: none ? 'none' : w.name, wireKg: none ? 0 : l.total });
      if (w) rows.push({ k: 'OUT', tidSuffix: 'w' + n, date, type: 'Usage', item: w.name, qty: l.total, godown: w.loc, notes: 'Chainlink production: ' + it.name });
      const wv = none ? 'none' : w.name; if ((it.wire || '') !== wv) { it.wire = wv; ups.push({ name: it.name, wire: wv }); }
      n++;
    });
    const opId = commit(rows, { summary: 'production', itemUpdates: ups, aliases });
    rows.filter(r => r.k === 'PROD').forEach(r => S.prod.push({ d: r.date, item: r.item, nos: r.nos, per: r.per, total: r.total, sqft: r.sqft, wire: r.wire, wireKg: r.wireKg, t: r.tid }));
    negWarn(rows.filter(r => r.k === 'OUT').map(r => r.item)); S.prev.prod = null; S.draft.prodText = ''; toast('Production saved'); render();
  },
  saveCut() {
    const date = parseDMY(val('cu_date')), party = val('cu_party').trim(), item = val('cu_item').trim(), q = num(val('cu_qty'));
    if (!date) { toast('Date should be dd-mm-yyyy', 'bad'); return; } if (!party || !item || !q) { toast('Fill party, item and length', 'bad'); return; }
    const row = { k: 'CUT', date, party, item, qty: fmt(q) + 'ft' };
    const opId = commit([row], { summary: 'cut' }); S.cuts.push([date, party, item, row.qty, row.tid]); S.draft.cuParty = ''; S.draft.cuItem = ''; toast('Cut recorded'); render();
  },
  saveManual() {
    const date = parseDMY(val('mn_date')), it = S.byKey[nk(val('mn_item'))], q = num(val('mn_qty'));
    if (!date) { toast('Date should be dd-mm-yyyy', 'bad'); return; } if (!it) { toast('Pick an item from the list', 'bad'); return; } if (!q || q <= 0) { toast('Enter a quantity', 'bad'); return; }
    commit([{ k: val('mn_dir'), date, type: val('mn_type'), item: it.name, qty: q, godown: it.loc, notes: val('mn_note').trim() }], { summary: 'manual entry' });
    negWarn([it.name]); toast('Entry saved'); render();
  },
  itemOpen(d) { S.ui.item = d.n; render(); window.scrollTo(0, 0); }, itemClose() { S.ui.item = null; render(); },
  itemSave(d) {
    const it = S.byKey[nk(d.n)], wire = val('ip_wire').trim();
    if (wire && !/^none$/i.test(wire) && !S.byKey[nk(wire)]) { toast('Wire must be an item from the list (or none)', 'bad'); return; }
    const u = { name: it.name, unit: val('ip_unit'), kgPer: num(val('ip_kg')), low: num(val('ip_low')), high: num(val('ip_high')), wire };
    Object.assign(it, u, { name: it.name }); queue({ action: 'commit', body: { opId: newOp(), by: S.by, summary: 'item settings', rows: [], itemUpdates: [u] } }); toast('Saved'); render();
  },
  saveBy() { S.by = val('s_by').trim(); ls.set('o5_by', S.by); toast('Saved'); },
  saveCfg() { S.cfg = { waitHrs: num(val('s_w')) || 3, lateHrs: num(val('s_l')) || 8 }; ls.set('o5_cfg', S.cfg); toast('Saved'); },
  theme(d) { S.theme = d.t; ls.set('o5_theme', d.t); render(); },
  async ping() { const el = $('#pingres'); el.textContent = 'Checking…'; try { const j = await api('ping'); el.textContent = '✓ Connected · Code.gs v' + j.version; } catch (e) { el.textContent = '⚠ ' + e.message; } },
  logout() { S.key = ''; ls.set('o5_key', ''); render(); }
};
const val_ = id => { const e = document.querySelector('[data-draft="' + id + '"]'); return e ? e.value : ''; };
function setLineItem(l, name, learnFlag) { l.item = name; l.learn = true; l.check = false; }
function setProdItem(l, name) { l.item = name; l.learn = true; const it = S.byKey[nk(name)]; if (it && it.wire && !l.wire) l.wire = it.wire; }
const C = {
  oinc(d, v, el) { S.prev.orders[+d.o].include = el.checked; render(); },
  oparty(d, v) { S.prev.orders[+d.o].party = v; }, oveh(d, v) { S.prev.orders[+d.o].vehicle = v; },
  lpick(d, v) { const l = S.prev.orders[+d.o].lines[+d.l]; const it = S.byKey[nk(v)]; if (it) { setLineItem(l, it.name); l.newItem = null; } else { l.item = null; } render(); },
  incpick(d, v) { const l = S.prev.inc.lines[+d.l]; const it = S.byKey[nk(v)]; if (it) setLineItem(l, it.name); else l.item = null; render(); },
  ppick(d, v) { const l = S.prev.prod.lines[+d.l]; const it = S.byKey[nk(v)]; if (it) setProdItem(l, it.name); else l.item = null; render(); },
  pwire(d, v) { const l = S.prev.prod.lines[+d.l]; const it = S.byKey[nk(v)]; l.wire = it ? it.name : (/^none$/i.test(v.trim()) ? 'none' : v.trim()); render(); },
  stgo(d, v) { S.stockGo = v; render(); }, stst(d, v) { S.stockSt = v; render(); }
};
const I = {
  ordq(d, v) { S.ordQ = v; const el = $('#ordlist'); if (el) el.innerHTML = ordListHtml(); },
  stq(d, v) { S.stockQ = v; const el = $('#stlist'); if (el) el.innerHTML = stockTable(); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset, el, e); } });
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && C[el.dataset.chg]) C[el.dataset.chg](el.dataset, el.value, el); });
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset) return;
  if (el.dataset.draft) S.draft[el.dataset.draft] = el.value; if (el.dataset.mask) maskDate(el);
  if (el.dataset.inp && I[el.dataset.inp]) I[el.dataset.inp](el.dataset, el.value, el);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter === 'login') A.login(); });
setInterval(() => { if (S.key && S.loaded && !S.busy && !flushing && !S.outbox.length && document.visibilityState === 'visible') loadAll(true); }, 120000);

/* ---------------- start ---------------- */
(function init() {
  const c = ls.get('o5_cache', null);
  if (c && S.key) { try { applyData(c); S.loaded = true; } catch (e) {} }
  render(); if (S.key) { loadAll(S.loaded); flush(); }
})();
</script>
